<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="{{basePath}}/editor/raw-editor.css" />
  </head>
  <body>
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="monaco-btn secondary" data-back-button title="Вернуться назад">
          <i class="bi bi-chevron-left"></i>
          <span>Назад</span>
        </button>
      </div>
      <div class="toolbar-right">
        <span class="badge">{{pathLabel}}</span>
        <button class="monaco-btn secondary" id="rename" title="Переименовать файл">
          <i class="bi bi-pencil-square"></i>
          <span>Переименовать</span>
        </button>
        <button class="monaco-btn" id="submit" title="Сохранить (Ctrl+S)">
          <i class="bi bi-save"></i>
          <span>Сохранить</span>
        </button>
        <button class="monaco-btn danger" id="delete" title="Удалить файл">
          <i class="bi bi-trash"></i>
          <span>Удалить</span>
        </button>
      </div>
    </div>

    <div class="editor-wrapper">
      <div id="editor"></div>
    </div>

    <script>
      window.CW_RAW_FILE_VIEWER = {
        basePath: {{basePathJson}},
        path: {{path}},
        pathUrl: {{pathUrl}},
        name: {{name}},
        content: {{content}},
        language: {{language}}
      };
    </script>
    <script src="{{basePath}}/monaco/monaco-editor.js"></script>
    <script src="{{basePath}}/editor/raw-file-viewer.js"></script>
  </body>
</html>
